<style>
  .tk-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .tk-row input { flex: 1; }
  .tk-list { list-style: none; padding: 0; margin: 0; }
  .tk-list li { padding: 10px 4px; border-bottom: 1px solid rgba(128,128,128,.25); cursor: pointer; }
  .tk-list li:hover { background: rgba(128,128,128,.1); }
  .tk-sub { font-size: 12px; opacity: .7; }
  .tk-msg { margin: 12px 0; opacity: .8; }
</style>

<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.search.title"></h1>
  <p class="homey-subtitle" data-i18n="pair.search.subtitle"></p>
</header>

<form class="tk-row" id="tk-form">
  <input class="homey-form-input" id="tk-q" type="text" data-i18n-ph="pair.search.placeholder" autocomplete="off" />
  <button class="homey-button-primary" type="submit" data-i18n="common.search"></button>
</form>
<div class="tk-msg" id="tk-msg"></div>
<ul class="tk-list" id="tk-list"></ul>

<script type="application/javascript">
  const T = (k, v) => { const s = Homey.__(k); return String(s).replace(/{{\s*(\w+)\s*}}/g, (_, n) => (v && v[n] != null ? v[n] : '')); }; // fills {{placeholders}} itself
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = Homey.__(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = Homey.__(el.dataset.i18nPh); });
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  $('tk-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const q = $('tk-q').value.trim();
    if (!q) return;
    $('tk-msg').textContent = T('common.searching');
    $('tk-list').innerHTML = '';
    try {
      const stops = await Homey.emit('search', q);
      if (!stops.length) { $('tk-msg').textContent = T('pair.search.none'); return; }
      $('tk-msg').textContent = T('pair.search.tap');
      for (const s of stops) {
        const li = document.createElement('li');
        const modes = (s.modes || []).map((m) => T(`common.modes.${m}`)).join(', ') || T('pair.search.noTraffic');
        li.innerHTML = `<div>${esc(s.name)}</div><div class="tk-sub">${esc(modes)} · ~${Math.round(s.dailyStops || 0)} ${esc(T('pair.search.perDay'))}</div>`;
        li.addEventListener('click', async () => {
          try {
            const device = await Homey.emit('create', s);
            await Homey.createDevice(device);
            Homey.done();
          } catch (e) { Homey.alert(e.message || String(e)); }
        });
        $('tk-list').appendChild(li);
      }
    } catch (e) {
      $('tk-msg').textContent = '';
      Homey.alert(e.message || String(e));
    }
  });
  $('tk-q').focus();
</script>
